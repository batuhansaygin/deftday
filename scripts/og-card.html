<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=DM+Serif+Display:ital@1&family=Inter:wght@500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #08080d; font-family: 'Space Grotesk', sans-serif; color: #f3efe7;
  }
  .grain {
    position: absolute; inset: 0; z-index: 5; opacity: .5;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
  }
  .blob1 {
    position: absolute; width: 700px; height: 700px; border-radius: 50%;
    right: -140px; top: -220px; filter: blur(10px);
    background: radial-gradient(circle, rgba(255,92,56,.55) 0%, rgba(255,92,56,.18) 45%, transparent 70%);
  }
  .blob2 {
    position: absolute; width: 520px; height: 520px; border-radius: 50%;
    left: -160px; bottom: -260px;
    background: radial-gradient(circle, rgba(255,176,58,.35) 0%, transparent 70%);
  }
  .sun {
    position: absolute; right: 150px; top: 110px; width: 260px; height: 260px;
    border-radius: 50%;
    background: linear-gradient(160deg, #ff5c38, #ffb03a);
    box-shadow: 0 0 120px 30px rgba(255,120,50,.5);
  }
  .hline { position: absolute; right: 120px; top: 412px; width: 320px; height: 5px; border-radius: 3px; background: linear-gradient(90deg,#ff5c38,#ffb03a); }
  .hline2 { position: absolute; right: 170px; top: 436px; width: 220px; height: 4px; border-radius: 2px; background: linear-gradient(90deg,#ff5c38,#ffb03a); opacity: .45; }
  .wrap { position: absolute; left: 84px; top: 140px; z-index: 3; }
  h1 { font-size: 150px; font-weight: 700; line-height: .95; letter-spacing: -.02em; }
  h1 .day {
    background: linear-gradient(120deg, #ff5c38, #ffb03a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 .serif { font-family: 'DM Serif Display', serif; font-style: italic; font-weight: 400; }
  .sub {
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 30px;
    letter-spacing: .12em; text-transform: uppercase; color: #9a96a5; margin-top: 46px;
  }
  .sub b { color: #ffa06e; font-weight: 600; }
</style>
</head>
<body>
  <div class="blob1"></div>
  <div class="blob2"></div>
  <div class="sun"></div>
  <div class="hline"></div>
  <div class="hline2"></div>
  <div class="wrap">
    <h1>DEFT<br><span class="day"><span class="serif">DAY</span>.</span></h1>
    <div class="sub">Independent App &amp; Game Studio — <b>iOS · Android · Web</b></div>
  </div>
  
</body>
</html>
